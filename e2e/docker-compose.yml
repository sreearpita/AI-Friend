services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowelle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - e2e-postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowelle"]
      interval: 2s
      timeout: 5s
      retries: 30

  e2e-admin-jwks:
    image: nginx:1.27-alpine
    volumes:
      - ${E2E_RUNTIME_DIR}/admin-jwks.json:/usr/share/nginx/html/jwks.json:ro
      - ./admin-jwks/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  ollama:
    image: ollama/ollama:latest
    volumes:
      - e2e-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${E2E_OLLAMA_MODEL:-qwen2.5:0.5b}"]
    restart: "no"

  ai-friend:
    build:
      context: ${AI_FRIEND_DIR}
      dockerfile: Dockerfile.e2e
    ports:
      - "18080:8080"
    environment:
      SERVER_PORT: 8080
      AIF_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aifriend
      AIF_DATASOURCE_DRIVER: org.postgresql.Driver
      AIF_DATASOURCE_USERNAME: postgres
      AIF_DATASOURCE_PASSWORD: postgres
      AIF_JPA_DDL_AUTO: validate
      AIF_OLLAMA_BASE_URL: http://ollama:11434
      AIF_OLLAMA_MODEL: ${E2E_OLLAMA_MODEL:-qwen2.5:0.5b}
      AIF_SECURITY_SEED_DEMO_TENANT: "true"
      AIF_DEMO_TENANT_SLUG: flowelle
      AIF_DEMO_TENANT_NAME: Flowelle E2E
      AIF_DEMO_API_KEY: dev-aif-demo-key
      AIF_ADMIN_ISSUER: https://e2e-admin.local
      AIF_ADMIN_AUDIENCE: ai-friend-admin
      AIF_ADMIN_JWKS_URI: http://e2e-admin-jwks/jwks.json
      AIF_ADMIN_REQUIRED_ROLE: aif-admin
      AIF_SECRETS_ALLOW_LITERAL: "false"
      AIF_DEMO_TOOL_SIGNING_SECRET: ${E2E_AIF_CALLBACK_SECRET}
      E2E_AIF_CALLBACK_SECRET: ${E2E_AIF_CALLBACK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
      e2e-admin-jwks:
        condition: service_started

  flowelle-cycles:
    build:
      context: ${FLOWELLE_DIR}/backend/cycles-service
      dockerfile: Dockerfile.e2e
    ports:
      - "18082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowelle_cycle
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: 0cb661660f45f6bd78dc82efa01a3c2c21ac8f4c3518ed53c8000c0f30766b39
      AIF_CALLBACK_KEY_ID: ${E2E_AIF_CALLBACK_KEY_ID}
      AIF_CALLBACK_SECRET: ${E2E_AIF_CALLBACK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  flowelle-auth:
    build:
      context: ${FLOWELLE_DIR}/backend/auth-service
      dockerfile: Dockerfile.e2e
    ports:
      - "18081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowelle
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: 0cb661660f45f6bd78dc82efa01a3c2c21ac8f4c3518ed53c8000c0f30766b39
      CYCLES_SERVICE_URL: http://flowelle-cycles:8082
      AIF_CALLBACK_KEY_ID: ${E2E_AIF_CALLBACK_KEY_ID}
      AIF_CALLBACK_SECRET: ${E2E_AIF_CALLBACK_SECRET}
      AIFRIEND_URL: http://ai-friend:8080
      AIFRIEND_TENANT_KEY: dev-aif-demo-key
      AIF_USER_CONTEXT_ISSUER: flowelle
      AIF_USER_CONTEXT_AUDIENCE: ai-friend-chat
      AIF_USER_CONTEXT_TENANT: flowelle
      AIF_USER_CONTEXT_KEY_ID: ${E2E_USER_CONTEXT_KEY_ID}
      AIF_USER_CONTEXT_PRIVATE_KEY_BASE64: ${E2E_USER_CONTEXT_PRIVATE_KEY_BASE64}
    depends_on:
      postgres:
        condition: service_healthy
      flowelle-cycles:
        condition: service_started
      ai-friend:
        condition: service_started

volumes:
  e2e-postgres:
  e2e-ollama:
